<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="zwallet — personal finance that never leaves your devices." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <title>zwallet</title>
    <!-- theme-init: applies the saved theme before first paint (no light/dark flash). Inline so it
         costs no request; the production CSP allows exactly this text by SHA-256 (vite.config.ts).
         Keep the key in sync with THEME_KEY in src/ui/theme.ts (a unit test checks it). -->
    <script>
      (function () {
        try {
          var pref = window.localStorage.getItem('zw.theme');
          if (pref === 'light' || pref === 'dark')
            document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {
          /* storage unavailable: follow the system theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
